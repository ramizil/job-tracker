{# Shared tab bar for Resume hub #}
{% set tab = resume_tab or 'library' %}

     href="{{ url_for('main.my_resumes') }}">📄 My resumes</a>

     href="{{ url_for('main.resume_builder') }}">🗣️ Build from scratch</a>
</nav>
